# =====================================================================
#  DocVault Document Management System
#  All credentials are read from environment variables so the app can
#  be started on any machine without editing this file. Defaults shown
#  are for local development only — override in production.
# =====================================================================

# ─── Server ───────────────────────────────────────────────────────────
server.port=8081
server.servlet.context-path=/api

# ─── Database (PostgreSQL) ────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/databasename
spring.datasource.username=postgres
spring.datasource.password=****
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ──────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── JWT ──────────────────────────────────────────────────────────────
# Secret must be a base64-encoded string of at least 32 bytes (256 bits).
# Generate one with:  openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION_MS}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS}

# ─── File Storage ─────────────────────────────────────────────────────
app.storage.upload-dir=${UPLOAD_DIR:./uploads}
app.storage.max-file-size=5242880

# Multipart limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
spring.servlet.multipart.max-request-size=50MB

# ─── Email (SMTP) ─────────────────────────────────────────────────────
# Defaults below disable real email dispatch safely. Fill in your SMTP
# credentials (or leave blank) in production.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=gmail.com
spring.mail.password=**** **** **** ****
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
app.mail.from= examplegmail.com
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# ─── Password reset tokens ────────────────────────────────────────────
app.password-reset.expiry-minutes=60

# ─── Logging ──────────────────────────────────────────────────────────
logging.level.com.dms=${LOG_LEVEL:INFO}
logging.level.org.springframework.security=INFO
